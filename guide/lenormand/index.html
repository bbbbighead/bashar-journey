  <p class="gd-lede">透過九張牌的整體組合，探索事件的過去、現在與未來，釐清事情的脈絡、影響因素，以及可能的發展方向。</p>
  <div class="gd-meta">
    <h2 class="gd-label">起源</h2>
    <p class="gd-meta-text">雷諾曼牌源自 19 世紀法國，因法國知名占卜師<b>瑪麗・安妮・雷諾曼</b>（Marie Anne Lenormand）而聞名。現代雷諾曼牌共有 36 張牌，著重牌與牌之間的組合關係，擅長分析現實事件與發展趨勢。</p>
  </div>

      <li>請給我的新計畫一些靈感。</li>
      <li>我目前的工作／感情／合作，接下來可能會如何發展？</li>
